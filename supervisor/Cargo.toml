[package]
name = "supervisor"
version = "0.1.0"
license = "Apache-2.0"
edition.workspace = true
rust-version.workspace = true
publish = false
default-run = "remux-supervisor"

[[bin]]
name = "remux-supervisor"
path = "src/bin/remux-supervisor.rs"

[[bin]]
name = "fake-agent"
path = "src/bin/fake-agent.rs"

[[bin]]
name = "trace-agent"
path = "src/bin/trace-agent.rs"

[dependencies]
# Local syscall seam only; no third-party crates.
remux-pty = { path = "../pty" }
